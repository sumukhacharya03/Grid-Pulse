# Fly.io config for hosting Grid-Pulse (see "Put it online" in the README).
# Change `app` to a name that's free, then: fly launch --copy-config --no-deploy
#
# Run exactly ONE machine: the market and game state live in one process and
# one SQLite file on the volume below. `fly scale count 1` if fly adds more.

app = "grid-pulse"
primary_region = "bom"

[build]

[env]
  GRIDPULSE_PUBLIC = "1"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/api/health"

[[mounts]]
  source = "gridpulse_data"
  destination = "/data"

[[vm]]
  memory = "512mb"
